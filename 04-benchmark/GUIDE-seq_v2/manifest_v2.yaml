reference_genome: /app/genome/Homo_sapiens.GRCh38.dna.primary_assembly_ChrOnly.fa
blacklist: hg38-blacklist.v2.bed.gz
genome: hg38
# if not specified, default is NGG
PAM: NGG

# output folder directory (absolute or relative path), if not specified, default is current dir
analysis_folder: ./


# PATH to analysis tools
# If not specified, default is just the tool name, i.e., accessible in the $PATH
bwa: bwa
samtools: samtools
bedtools: bedtools
umi_tools: umi_tools

# optional, to generate the off-target Manhattan plot
Rscript: Rscript


window_size: 25
max_score: 7
mapq_threshold: 50


# DEMULTIPLEX 
# ------------
demultiplex:
    min_reads: 1
    mismatch: 1
    forward: Undetermined_R1.fastq
    reverse: Undetermined_R2.fastq
    index1: Undetermined_I1.fastq
    index2: Undetermined_I2.fastq
    out_dir: demultiplexed # relative to analysis_folder
    input_dir: ./ # relative to analysis_folder
    subsample_reads: -1

